<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Первичная настройка - Домашний библиотекарь</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: 'Segoe UI', Tahoma, sans-serif; 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); 
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            width: 100%;
            background: white;
            border-radius: 16px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        .logo {
            font-size: 64px;
            margin-bottom: 10px;
        }
        h1 {
            color: #2c3e50;
            font-size: 28px;
            margin-bottom: 10px;
        }
        .subtitle {
            color: #666;
            font-size: 16px;
        }
        .step {
            margin-bottom: 25px;
        }
        .step-label {
            display: block;
            color: #2c3e50;
            font-weight: bold;
            margin-bottom: 10px;
            font-size: 15px;
        }
        select {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 15px;
            background: white;
            cursor: pointer;
        }
        select:focus {
            border-color: #3498db;
            outline: none;
        }
        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-primary {
            background: #3498db;
            color: white;
        }
        .btn-primary:hover {
            background: #2980b9;
        }
        .btn-primary:disabled {
            background: #bdc3c7;
            cursor: not-allowed;
        }
        .btn-secondary {
            background: #ecf0f1;
            color: #666;
            margin-top: 10px;
        }
        .btn-secondary:hover {
            background: #d5dbdb;
        }
        .status {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            display: none;
        }
        .status.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .status.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .status.loading {
            background: #fff3cd;
            color: #856404;
            border: 1px solid #ffeeba;
        }
        .progress {
            margin-top: 15px;
        }
        .progress-bar {
            height: 8px;
            background: #ecf0f1;
            border-radius: 4px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: #3498db;
            transition: width 0.3s;
        }
        .drives-list {
            margin-top: 10px;
        }
        .drive-item {
            padding: 10px;
            margin: 5px 0;
            background: #f8f9fa;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .drive-item:hover {
            background: #e9ecef;
        }
        .drive-item.selected {
            background: #3498db;
            color: white;
        }
        .footer {
            text-align: center;
            margin-top: 30px;
            color: #999;
            font-size: 13px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">📚</div>
            <h1>Добро пожаловать!</h1>
            <p class="subtitle">Давайте настроим вашу библиотеку</p>
        </div>
        
        <div id="setupContent">
            <div class="step">
                <label class="step-label">1. Выберите папку с книгами</label>
                <button id="selectFolderBtn" class="btn-primary">
                    📁 Выбрать папку
                </button>
                <p id="selectedPath" style="margin-top:10px;color:#666;font-size:13px;"></p>
            </div>
            
            <div class="step" id="actionStep" style="display:none;">
                <label class="step-label">2. Действие</label>
                <button id="scanBtn" class="btn-primary">
                    🔍 Начать сканирование
                </button>
                <button id="skipBtn" class="btn-secondary">
                    ⏭️ Пропустить (добавить позже)
                </button>
            </div>
        </div>
        
        <div id="status" class="status"></div>
        
        <div id="progress" class="progress" style="display:none;">
            <div class="progress-bar">
                <div class="progress-fill" style="width:0%"></div>
            </div>
        </div>
        
        <div class="footer">
            Домашний библиотекарь v1.0.0
        </div>
    </div>

    <script>
        let selectedPath = '';
        
        // Use server-side folder dialog via API
        async function selectFolderViaDialog() {
            try {
                const res = await fetch('/api/setup/select-folder', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({})
                });
                const data = await res.json();
                
                if (data.success && data.selected_path) {
                    selectedPath = data.selected_path;
                    document.getElementById('selectedPath').textContent = `Выбрано: ${selectedPath}`;
                    document.getElementById('actionStep').style.display = 'block';
                    document.getElementById('scanBtn').disabled = false;
                }
            } catch (e) {
                showStatus('error', 'Ошибка: ' + e.message);
            }
        }
        
        // Override button click to use server dialog
        document.getElementById('selectFolderBtn').onclick = selectFolderViaDialog;
        
        async function saveAndScan() {
            document.getElementById('scanBtn').disabled = true;
            document.getElementById('skipBtn').disabled = true;
            showStatus('loading', 'Сохранение настроек...');
            
            try {
                // Save path
                const saveRes = await fetch('/api/setup/save-path', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({path: selectedPath})
                });
                
                if (!saveRes.ok) {
                    const errorData = await saveRes.json().catch(() => ({}));
                    throw new Error(errorData.detail || errorData.message || 'Failed to save path');
                }
                
                showStatus('loading', 'Сканирование библиотеки...');
                document.getElementById('progress').style.display = 'block';
                
                // Start scan - send path directly to avoid config reload issues
                const scanRes = await fetch('/api/setup/scan', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({path: selectedPath})
                });
                
                // Check if response is JSON
                const contentType = scanRes.headers.get('content-type');
                if (!contentType || !contentType.includes('application/json')) {
                    throw new Error('Сервер вернул неправильный ответ. Возможно, папка не содержит книг или произошла ошибка на сервере.');
                }
                
                const scanData = await scanRes.json();
                
                if (scanData.success) {
                    document.querySelector('.progress-fill').style.width = '100%';
                    showStatus('success', 
                        `Готово! Импортировано: ${scanData.imported} новых, ` +
                        `${scanData.updated} обновлено.`);
                    
                    setTimeout(() => {
                        window.location.href = '/';
                    }, 2000);
                } else {
                    throw new Error(scanData.message || 'Неизвестная ошибка при сканировании');
                }
            } catch (e) {
                console.error('Scan error:', e);
                let errorMessage = e.message || 'Неизвестная ошибка';
                
                // Provide more user-friendly error messages
                if (errorMessage.includes('Failed to fetch') || errorMessage.includes('NetworkError')) {
                    errorMessage = 'Не удалось подключиться к серверу. Проверьте, что сервер запущен.';
                } else if (errorMessage.includes('Path does not exist')) {
                    errorMessage = 'Выбранная папка не существует или недоступна.';
                } else if (errorMessage.includes('DEFAULT_SOURCE_PATH')) {
                    errorMessage = 'Ошибка конфигурации сервера. DEFAULT_SOURCE_PATH не настроен.';
                }
                
                showStatus('error', 'Ошибка: ' + errorMessage);
                document.getElementById('scanBtn').disabled = false;
                document.getElementById('skipBtn').disabled = false;
                document.getElementById('progress').style.display = 'none';
            }
        }
        
        async function skipSetup() {
            try {
                await fetch('/api/setup/skip', {method: 'POST'});
                window.location.href = '/';
            } catch (e) {
                console.error(e);
                window.location.href = '/';
            }
        }
        
        function showStatus(type, message) {
            const status = document.getElementById('status');
            status.className = 'status ' + type;
            
            // Add retry button for errors
            if (type === 'error') {
                status.innerHTML = `
                    <div>${message}</div>
                    <button onclick="retryScan()" style="margin-top:10px;padding:8px 16px;background:#3498db;color:white;border:none;border-radius:4px;cursor:pointer;">
                        Повторить попытку
                    </button>
                `;
            } else {
                status.textContent = message;
            }
            
            status.style.display = 'block';
        }
        
        function hideStatus() {
            document.getElementById('status').style.display = 'none';
        }
        
        async function retryScan() {
            document.getElementById('status').style.display = 'none';
            await saveAndScan();
        }
        
        // Event listeners
        document.getElementById('scanBtn').onclick = saveAndScan;
        document.getElementById('skipBtn').onclick = skipSetup;
    </script>
</body>
</html>
